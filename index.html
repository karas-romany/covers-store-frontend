<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر الجرابات الفاخرة</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- شريط التنقل المتحرك Navbar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="#" class="nav-logo">📱 متجر الجرابات</a>
      <ul class="nav-links">
        <li><a href="#" onclick="filterByBrand('all')" class="active">الكل</a></li>
        <li><a href="#" onclick="filterByBrand('Oppo')">أوبو</a></li>
        <li><a href="#" onclick="filterByBrand('Samsung')">سامسونج</a></li>
        <li><a href="#" onclick="filterByBrand('Xiaomi')">شاومي</a></li>
        <li><a href="https://wa.me/201275551116" target="_blank" class="contact-nav-btn">💬 تواصل معنا</a></li>
      </ul>
    </div>
  </nav>

  <header style="margin-top: 80px;">
    <h1>تشكيلة الجرابات المتاحة</h1>
    <p>اختر ماركة هاتفك واستكشف أحدث الجرابات</p>
  </header>

  <main>
    <!-- شريط البحث -->
    <div class="search-box">
      <input type="text" id="search-input" placeholder="ابحث باسم الموديل أو نوع الجراب..." onkeyup="handleSearch()">
    </div>

    <!-- أزرار الفلترة السريعة -->
    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterByBrand('all')">الكل</button>
      <button class="filter-btn" onclick="filterByBrand('Oppo')">Oppo</button>
      <button class="filter-btn" onclick="filterByBrand('Samsung')">Samsung</button>
      <button class="filter-btn" onclick="filterByBrand('Xiaomi')">Xiaomi</button>
    </div>

    <!-- شبكة عرض الجرابات -->
    <div id="covers-container" class="covers-grid">
      <div class="loading">جاري تحميل الجرابات...</div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
