<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معرض الجرابات الفاخرة</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>معرض الجرابات الملكية</h1>
    <p>استعراض أفضل الأغطية والجرابات المميزة لهاتفك</p>
  </header>

  <!-- شريط البحث الجديد -->
  <div class="search-container">
    <input type="text" id="search-input" placeholder="ابحث عن جراب أو موديل معين..." oninput="handleSearch()">
  </div>

  <!-- أزرار التصفية المعدلة (أوبو بدل آيفون) -->
  <div class="filters">
    <button class="filter-btn active" onclick="filterByBrand('all')">الكل</button>
    <button class="filter-btn" onclick="filterByBrand('Oppo')">أوبو</button>
    <button class="filter-btn" onclick="filterByBrand('Samsung')">سامسونج</button>
    <button class="filter-btn" onclick="filterByBrand('Xiaomi')">شاومي</button>
  </div>

  <main class="container">
    <div id="covers-container" class="covers-grid">
      <!-- يتم تحميل الجرابات هنا تلقائياً -->
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
