<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - إضافة جراب جديد</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-container {
      max-width: 500px;
      margin: 40px auto;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 30px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .form-group {
      margin-bottom: 20px;
      text-align: right;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      color: #e2e8f0;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px 15px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: #78ffd6;
    }
    .submit-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .submit-btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }
    .status-msg {
      margin-top: 15px;
      text-align: center;
      font-weight: 700;
    }
    .nav-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #78ffd6;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>لوحة إضافة الجرابات</h1>
    <p>أضف بيانات الجراب ليظهر فوراً في المعرض</p>
  </header>

  <main class="admin-container">
    <form id="add-cover-form">
      <div class="form-group">
        <label>عنوان/وصف الجراب:</label>
        <input type="text" id="title" placeholder="مثال: جراب سيليكون أسود" required>
      </div>

      <div class="form-group">
        <label>الماركة:</label>
        <select id="brand" required>
          <option value="iPhone">آيفون (iPhone)</option>
          <option value="Samsung">سامسونج (Samsung)</option>
          <option value="Xiaomi">شاومي (Xiaomi)</option>
          <option value="Other">ماركة أخرى</option>
        </select>
      </div>

      <div class="form-group">
        <label>الموديل:</label>
        <input type="text" id="modelName" placeholder="مثال: iPhone 14 Pro" required>
      </div>

      <button type="submit" class="submit-btn">إضافة الجراب الآن</button>
      <div id="status-msg" class="status-msg"></div>
    </form>

    <a href="index.html" class="nav-link">← العودة لمعرض الجرابات</a>
  </main>

  <script>
    const API_URL = "https://covers-store-server.vercel.app/api/covers";

    document.getElementById("add-cover-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const statusMsg = document.getElementById("status-msg");
      statusMsg.style.color = "#78ffd6";
      statusMsg.innerText = "جاري الإضافة...";

      const coverData = {
        title: document.getElementById("title").value,
        brand: document.getElementById("brand").value,
        modelName: document.getElementById("modelName").value
      };

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(coverData)
        });

        if (response.ok) {
          statusMsg.style.color = "#34d399";
          statusMsg.innerText = "تمت إضافة الجراب بنجاح! 🎉";
          document.getElementById("add-cover-form").reset();
        } else {
          statusMsg.style.color = "#f87171";
          statusMsg.innerText = "حدث خطأ أثناء الإضافة.";
        }
      } catch (error) {
        console.error("Error:", error);
        statusMsg.style.color = "#f87171";
        statusMsg.innerText = "تعذر الاتصال بالسيرفر. تحقق من الإنترنت.";
      }
    });
  </script>
</body>
</html>
