<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إضافة جراب جديد - لوحة التحكم</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-form {
      max-width: 500px;
      margin: 2rem auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .submit-btn {
      width: 100%;
      padding: 12px;
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }
    .submit-btn:hover { background-color: #219150; }
  </style>
</head>
<body>

  <header>
    <h1>⚙️ إضافة جراب جديد للمتجر</h1>
  </header>

  <main class="container">
    <form id="add-cover-form" class="admin-form">
      <div class="form-group">
        <label>عنوان الجراب:</label>
        <input type="text" id="title" placeholder="مثال: جراب سيليكون شفاف" required>
      </div>

      <div class="form-group">
        <label>الماركة:</label>
        <select id="brand" required>
          <option value="Oppo">أوبو (Oppo)</option>
          <option value="Samsung">سامسونج (Samsung)</option>
          <option value="Realme">ريلمي (Realme)</option>
          <option value="Xiaomi">شاومي (Xiaomi)</option>
          <option value="iPhone">آيفون (iPhone)</option>
        </select>
      </div>

      <div class="form-group">
        <label>الموديل:</label>
        <input type="text" id="modelName" placeholder="مثال: A54 أو Reno 8" required>
      </div>

      <div class="form-group">
        <label>السعر (بالجنيه):</label>
        <input type="number" id="price" placeholder="150" required>
      </div>

      <div class="form-group">
        <label>رابط صورة الجراب (URL):</label>
        <input type="url" id="imageUrl" placeholder="https://example.com/image.jpg">
      </div>

      <button type="submit" class="submit-btn">إضافة الجراب للمتجر</button>
    </form>
  </main>

  <script>
    document.getElementById('add-cover-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const coverData = {
        title: document.getElementById('title').value,
        brand: document.getElementById('brand').value,
        modelName: document.getElementById('modelName').value,
        price: Number(document.getElementById('price').value),
        imageUrl: document.getElementById('imageUrl').value
      };

      try {
        const response = await fetch('http://localhost:5000/api/covers', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(coverData)
        });

        if (response.ok) {
          alert('تم إضافة الجراب بنجاح!');
          window.location.href = 'index.html'; // التوجيه للصفحة الرئيسية
        } else {
          alert('حدث خطأ أثناء الإضافة');
        }
      } catch (err) {
        console.error(err);
        alert('تعذر الاتصال بالسيرفر');
      }
    });
  </script>
</body>
</html>
