<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- إجبار المتصفح والموبايل على وضع Light Mode دائماً -->
  <meta name="color-scheme" content="light">
  <title>لوحة التحكم - متجر الجرابات</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">

  <!-- شريط التنقل العلوي -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">📱 متجر الجرابات</a>
      <ul class="nav-links">
        <li><a href="index.html">المتجر الرئيسي</a></li>
        <li><a href="admin.html" class="admin-nav-btn">لوحة التحكم</a></li>
      </ul>
    </div>
  </nav>

  <!-- محتوى لوحة التحكم -->
  <div class="admin-container">
    <div class="admin-card">
      <h1 class="admin-title">لوحة إدارة المتجر</h1>
      <p class="admin-subtitle">التحكم في حالة الصيانة والجرابات المعروضة</p>

      <!-- قسم مفتاح الصيانة -->
      <div class="control-section">
        <div class="switch-row">
          <div class="switch-info">
            <h3>وضع الصيانة (Maintenance Mode)</h3>
            <p>عند تفعيل هذا الخيار، سيظهر للمستخدمين أن الموقع قيد الصيانة بدلاً من الجرابات.</p>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="maintenance-toggle" onchange="toggleMaintenance()">
            <span class="slider"></span>
          </label>
        </div>
        <div id="status-message" class="status-msg">جاري فحص الحالة...</div>
      </div>

      <!-- قسم إضافة جراب جديد -->
      <div class="control-section">
        <h3>إضافة جراب جديد</h3>
        <form id="add-cover-form" onsubmit="handleAddCover(event)" class="admin-form">
          <div class="form-group">
            <label>عنوان الجراب / الاسم:</label>
            <input type="text" id="cover-title" placeholder="مثال: جراب سيليكون فاخر" required>
          </div>
          <div class="form-group">
            <label>موديل الهاتف:</label>
            <input type="text" id="cover-model" placeholder="مثال: iPhone 15 Pro Max" required>
          </div>
          <div class="form-group">
            <label>الماركة:</label>
            <select id="cover-brand" required>
              <option value="iPhone">آيفون (iPhone)</option>
              <option value="Samsung">سامسونج (Samsung)</option>
              <option value="Xiaomi">شاومي (Xiaomi)</option>
              <option value="Realme">ريلمي (Realme)</option>
              <option value="Oppo">أوبو (Oppo)</option>
              <option value="Other">أخرى</option>
            </select>
          </div>
          <button type="submit" class="submit-btn">➕ إضافة الجراب</button>
        </form>
      </div>

    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
